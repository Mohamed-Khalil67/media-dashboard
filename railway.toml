[build]
builder = "NIXPACKS"
buildCommand = "cd frontend && npm ci && npm run build && cd ../backend && cp -r ../frontend/dist/frontend/browser ./public && npm ci && npm run build && npx prisma generate && npx prisma migrate deploy"

[deploy]
startCommand = "cd backend && node dist/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
