[build]
builder = "NIXPACKS"
buildCommand = "cd frontend && npm ci && npm run build && cd ../backend && cp -r ../frontend/dist/frontend/browser ./public && npm ci && npm run build && npx prisma generate"

[deploy]
startCommand = "cd backend && npx prisma migrate deploy && node dist/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
