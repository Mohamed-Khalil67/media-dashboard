# Local development database.
#
#   docker compose up -d        start Postgres (data survives restarts)
#   docker compose down         stop it
#   docker compose down -v      stop it AND delete all local data
#
# Runs on host port 5433 so it never clashes with a natively installed
# PostgreSQL on 5432. Matching DATABASE_URL for backend/.env:
#   postgresql://media:media@localhost:5433/media_dashboard
# These credentials are for local development only.
services:
  postgres:
    image: postgres:17-alpine
    container_name: media-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media_dashboard
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - media-dashboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  media-dashboard-pgdata:
